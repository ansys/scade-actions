version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    ignore:
        - dependency-name: "sphinx"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    assignees:
      - "pyansys-ci-bot"
    commit-message:
      prefix: "build(deps)"
    groups:
      dependencies:
          patterns:
            # group all dependencies to minimize repository management
            - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
    assignees:
      - "pyansys-ci-bot"
    commit-message:
      prefix: "ci"
    groups:
       actions:
          patterns:
            - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "ansys/pre-commit-hooks/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "chore(pre-commit)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    assignees:
      - "ansjhenry"
